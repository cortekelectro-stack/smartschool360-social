<html><head><meta charset=utf-8><style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Archivo+Narrow:wght@600&display=block');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#EDEBE4;font-family:Archivo;color:#0E0F0C;position:relative}
.big{position:absolute;left:-40px;top:430px;font:900 760px/0.8 Archivo;letter-spacing:-50px;color:#A3CF44}
.grid{position:absolute;inset:0;background-image:linear-gradient(#0E0F0C14 1px,transparent 1px),linear-gradient(90deg,#0E0F0C14 1px,transparent 1px);background-size:90px 90px}
.prod{position:absolute;left:80px;top:700px;width:920px;filter:drop-shadow(0 40px 30px rgba(0,0,0,.3))}.floor{position:absolute;left:140px;top:1040px;width:820px;height:60px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),rgba(0,0,0,0))}
.hd{position:absolute;left:72px;right:72px;top:64px;display:flex;justify-content:space-between;font:600 20px 'Archivo Narrow';letter-spacing:4px;text-transform:uppercase}
h1{position:absolute;left:72px;top:120px;font:900 112px/0.92 Archivo;letter-spacing:-4px;text-transform:uppercase}
h1 i{font-style:normal;-webkit-text-stroke:3px #0E0F0C;color:transparent}
.ft{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.ft p{font:500 30px/1.3 Archivo;max-width:600px}
.ft span{font:600 20px 'Archivo Narrow';letter-spacing:4px;text-transform:uppercase}
.stamp{position:absolute;right:90px;top:440px;width:200px;height:200px;border-radius:50%;background:#0E0F0C;color:#EDEBE4;display:flex;align-items:center;justify-content:center;text-align:center;font:700 22px/1.2 Archivo;transform:rotate(-12deg)}
</style></head><body><div class=grid></div><div class=big>360</div>
<div class=hd><span>Cortek Electro · Pune</span><span>Update 2026</span></div>
<h1>The whole<br>school day.<br><i>One screen.</i></h1>

<div class=floor></div><img class=prod src=product-clean.png><div class=stamp style="z-index:2;top:560px;right:80px">Bells<br>Prayers<br>PA · Siren</div>
<div class=ft><p><b>Smart School 360.</b> What we've built since our last update.</p><span>Swipe →</span></div>
</body></html>
